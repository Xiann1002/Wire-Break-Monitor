/* ---------- CONFIG ---------- */
const PAGES = [

  {g:"ADMIN",id:"export",zh:"数据导出",en:"Export",ic:"📦"},
];
const ICONS={}; PAGES.forEach(p=>ICONS[p.id]=p.ic);
const CFG = { assumedYear: 2026, cosThreshold: 0, cosTarget: 2, successTarget: 85 };
const STORAGE_KEY="wireBreakTool_autosave_v1";
function saveState(){
  try{
    const payload={savedAt:new Date().toISOString(),state:{mes:state.mes,chinese:state.chinese,local:state.local,events:state.events,
      selectedEvent:state.selectedEvent,page:state.page,ltsQuery:state.ltsQuery,pasteText:state.pasteText,dashFrom:state.dashFrom,dashTo:state.dashTo,gran:state.gran},
      cfg:{cosThreshold:CFG.cosThreshold,cosTarget:CFG.cosTarget,successTarget:CFG.successTarget}};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  }catch(e){ console.warn("Autosave failed (storage full or unavailable):", e.message); }
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return;
    const payload=JSON.parse(raw); if(!payload||!payload.state) return;
    Object.assign(state, payload.state);
    if(payload.cfg) Object.assign(CFG, payload.cfg);
    state.page="upload"; state._restoredAt=payload.savedAt;
  }catch(e){ console.warn("Could not restore autosaved data:", e.message); }
}

/* ---------- PARSING: quote-aware TSV/CSV (handles multi-line Excel header cells) ---------- */
function parseDelimited(text){
  const delim = text.includes("\t") ? "\t" : ",";
  const rows=[]; let row=[]; let field=""; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQuotes){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=ch;
    } else {
      if(ch==='"') inQuotes=true;
      else if(ch===delim){ row.push(field); field=""; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(ch==='\r'){}
      else field+=ch;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
function colIndex(headers,keywords){ return headers.findIndex(h=>keywords.some(k=>String(h).toLowerCase().includes(k))); }
function normalizeDate(str){
  if(!str) return null; str=String(str).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0,10);
  const m=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){ let mo=+m[1],da=+m[2],yr=+m[3]; if(mo>12){[mo,da]=[da,mo];} return yr+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0"); }
  return str;
}
function normalizeMachine(v){ if(v==null) return null; const s=String(v).trim(); if(!s) return null; if(/^\d+$/.test(s)) return "EWS2-"+s; return s.toUpperCase(); }
function parseChineseDateShift(v){
  if(!v) return {date:null,shift:null};
  const s=String(v).trim();
  const m=s.match(/^(\d{1,2})\.(\d{1,2})\s*(白|夜)?/);
  if(m){ const mo=+m[1],da=+m[2]; const shift=m[3]==="夜"?"NIGHT":(m[3]==="白"?"DAY":null);
    return {date:CFG.assumedYear+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0"), shift}; }
  return {date:s,shift:null};
}
function stdShift(v){ if(!v)return null; const s=String(v).trim(); if(/^(D|Day|白|白班)$/i.test(s))return "DAY"; if(/^(N|Night|夜|夜班)$/i.test(s))return "NIGHT"; return s.toUpperCase(); }
function stdAction(v){ if(!v)return null; const s=String(v).toLowerCase(); if(s.includes("knot")||s.includes("接线")||s.includes("刃线"))return "KNOT/RECONNECT"; if(s.includes("reinsert")||s.includes("纫线"))return "REINSERT"; if(s.includes("weld")||s.includes("焊线"))return "WELD"; return String(v).toUpperCase(); }

function hashRow(obj){ const s=JSON.stringify(obj); let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function buildMES(headers, rows){
  const I=k=>colIndex(headers,k);
  const idx={Date:I(["date"]),Shift:I(["shift"]),LTS:I(["lts"]),Machine:I(["machine no","machine"]),Product:I(["product type"]),
    Cause:I(["wire break reason"]),Action:I(["handling method"]),Discard:I(["discard length"]),DReason:I(["discard reason"]),
    GradeA:I(["total grade a"]),GradeA2:I(["grade a (pcs"]),As1:I(["cosmetics as"]),CosA:I(["cosmetics a-"]),TotCos:I(["total cosmetics"]),
    Pass:I(["one time pass rate"]),Loss:I(["wire break loss"]),Eff:I(["effective wafer"]),
    RId:I(["rescuers employee id"]),RName:I(["rescuers employee name"])};
  const g=(c,k)=>idx[k]>-1?c[idx[k]]:null;
  return rows.map((c,i)=>{
    const as1=num(g(c,"As1")), cosA=num(g(c,"CosA")); let tot=num(g(c,"TotCos"));
    if(tot==null&&(as1!=null||cosA!=null)) tot=(as1||0)+(cosA||0);
    let gA=num(g(c,"GradeA")); if(gA==null) gA=num(g(c,"GradeA2"));
    const rec={Date:normalizeDate(g(c,"Date")),Shift:stdShift(g(c,"Shift")),LTS:String(g(c,"LTS")||"").trim().toUpperCase(),
      Machine:normalizeMachine(g(c,"Machine")),ProductType:String(g(c,"Product")||"").trim()||null,Cause:g(c,"Cause"),Action:g(c,"Action"),
      Discard:num(g(c,"Discard"))||0,DiscardReason:g(c,"DReason"),GradeA:gA,As1:as1,CosA:cosA,TotalCos:tot,PassRate:num(g(c,"Pass")),
      WbLoss:num(g(c,"Loss")),EffWafer:num(g(c,"Eff")),RescuerId:String(g(c,"RId")||"").trim(),RescuerName:String(g(c,"RName")||"").trim(),Emp:null};
    rec.id="M-"+hashRow(rec); return rec;
  }).filter(r=>r.LTS);
}

function buildChinese(headers, rows){
  const idx={Date:colIndex(headers,["日期"]),Machine:colIndex(headers,["机台号"]),LTS:colIndex(headers,["流水码"]),
    Cause:colIndex(headers,["断线舍弃原因","原因"]),Discard:colIndex(headers,["舍弃长度"]),Action:colIndex(headers,["挽救措施"]),
    EmpName:colIndex(headers,["挽救人"])};
  return rows.map((c,i)=>{ const ds=parseChineseDateShift(idx.Date>-1?c[idx.Date]:"");
    const rec={Date:ds.date,Shift:ds.shift,LTS:idx.LTS>-1?String(c[idx.LTS]||"").trim().toUpperCase():"",
      Machine:idx.Machine>-1?normalizeMachine(c[idx.Machine]):null,Cause:idx.Cause>-1?c[idx.Cause]:null,Action:idx.Action>-1?c[idx.Action]:null,
      Discard:idx.Discard>-1?(Number(c[idx.Discard])||0):0,GradeA:null,CosA:null,Emp:null,EmpName:idx.EmpName>-1?(c[idx.EmpName]||null):null};
    rec.id="C-"+hashRow(rec); return rec;
  }).filter(r=>r.LTS);
}
function buildLocal(headers, rows){
  const idx={Date:colIndex(headers,["date"]),LTS:colIndex(headers,["beam id"]),Machine:colIndex(headers,["ws"]),
    Cause:colIndex(headers,["root cause"]),Action:colIndex(headers,["action"]),Discard:colIndex(headers,["shorten amount"]),
    Shift:colIndex(headers,["d/n"]),Emp:colIndex(headers,["recovery emp id"])};
  return rows.map((c,i)=>{ const rec={Date:normalizeDate(idx.Date>-1?c[idx.Date]:null),Shift:idx.Shift>-1?stdShift(c[idx.Shift]):null,
    LTS:idx.LTS>-1?String(c[idx.LTS]||"").trim().toUpperCase():"",Machine:idx.Machine>-1?normalizeMachine(c[idx.Machine]):null,
    Cause:idx.Cause>-1?c[idx.Cause]:null,Action:idx.Action>-1?c[idx.Action]:null,Discard:idx.Discard>-1?(Number(c[idx.Discard])||0):0,
    GradeA:null,CosA:null,Emp:idx.Emp>-1?(c[idx.Emp]||null):null};
    rec.id="L-"+hashRow(rec); return rec;
  }).filter(r=>r.LTS);
}
function mergeRecords(existing,incoming){
  const map={}; (existing||[]).forEach(r=>map[r.id]=r);
  let added=0; incoming.forEach(r=>{ if(!(r.id in map)) added++; map[r.id]=r; });
  return {merged:Object.values(map), added, duplicates:incoming.length-added};
}
function parsePaste(key){
  const ta=document.getElementById("paste_"+key);
  const text=(ta?ta.value:"").trim();
  if(!text){ alert("Paste your data first — include the header row."); return; }
  const grid=parseDelimited(text);
  if(grid.length<2){ alert("No data rows found below the header row."); return; }
  const headers=grid[0].map(h=>String(h||"").trim());
  const rows=grid.slice(1);
  let records;
  if(key==="mes") records=buildMES(headers,rows);
  else if(key==="chinese") records=buildChinese(headers,rows);
  else records=buildLocal(headers,rows);
  if(!records.length){ alert("Parsed 0 valid rows — the LTS / Beam ID column wasn't detected. Check the reference template above."); return; }
  const {merged,added,duplicates}=mergeRecords(state[key],records);
  state[key]=merged;
  alert(`Added ${added} new record(s) to ${key}.${duplicates?" "+duplicates+" exact duplicate(s) already saved were skipped.":""} Total saved: ${merged.length}.\n\nThis text box is just scratch space — your saved data is safe even if you edit or clear it. Use the small ✕ to clear the box, or "Clear saved data" to actually delete what's stored.`);
  render();
}

function resolveEmployee(rec, src){
  if(src==="chinese") return {type:"China Support",name:rec.EmpName||null,id:null};
  if(src==="mes"){ const n=rec.RescuerName;
    if(!n) return {type:"Unknown",name:null,id:rec.RescuerId||null};
    return {type:hasCJK(n)?"China Support":"Local",name:n,id:rec.RescuerId||null}; }
  const id=String(rec.Emp||"").trim(); const m=id&&EMPLOYEE_MASTER[id];
  return {type:!id?"Unknown":(/cst/i.test(id)?"China Support":"Local"),name:m?m.name:null,id:id||null};
}

function todayStr(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
function makeEvent(o){
  const m=o.sources.mes;
  return {id:"WB-"+o.today+"-"+String(o.seq).padStart(4,"0"),date:o.date,shift:o.shift,lts:o.lts,machine:o.machine,
    productType:m?m.ProductType:null,cause:o.cause,action:stdAction(o.action),handling:m?m.Action:null,discard:o.discard,
    gradeA:m?m.GradeA:null,as1:m?m.As1:null,cosA:m?m.CosA:null,totalCos:m?m.TotalCos:null,discardReason:m?m.DiscardReason:null,
    passRate:m?m.PassRate:null,wbLoss:m?m.WbLoss:null,effWafer:m?m.EffWafer:null,
    empType:o.emp.type,empId:o.emp.id,empName:o.emp.name,status:o.status,confidence:o.confidence,source:o.source,sources:o.sources};
}
function runPipeline(){
  const mesByLTS={},chiByLTS={},locByLTS={};
  state.mes.forEach(r=>(mesByLTS[r.LTS]=mesByLTS[r.LTS]||[]).push(r));
  state.chinese.forEach(r=>(chiByLTS[r.LTS]=chiByLTS[r.LTS]||[]).push(r));
  state.local.forEach(r=>(locByLTS[r.LTS]=locByLTS[r.LTS]||[]).push(r));
  const allLTS=new Set([...Object.keys(mesByLTS),...Object.keys(chiByLTS),...Object.keys(locByLTS)]);
  const today=todayStr(); let seq=1; const events=[];
  allLTS.forEach(lts=>{
    const mesRecs=mesByLTS[lts]||[], chiRecs=chiByLTS[lts]||[], locRecs=locByLTS[lts]||[];
    const manual=[...chiRecs.map(r=>({...r,_src:"Chinese"})),...locRecs.map(r=>({...r,_src:"Local"}))];
    const conflict=chiRecs.length&&locRecs.length&&Math.abs((chiRecs[0].Discard||0)-(locRecs[0].Discard||0))>10;
    if(mesRecs.length){
      mesRecs.forEach(mesRec=>{
        const enrich=manual.find(m=>Math.abs((m.Discard||0)-(mesRec.Discard||0))<=10)||manual[0]||null;
        const emp=mesRec.RescuerName?resolveEmployee(mesRec,"mes"):(enrich?resolveEmployee(enrich,enrich._src==="Chinese"?"chinese":"local"):{type:"Unknown",name:null,id:null});
        events.push(makeEvent({today,seq:seq++,lts,date:mesRec.Date,shift:mesRec.Shift,machine:mesRec.Machine,cause:mesRec.Cause,
          action:mesRec.Action||(enrich&&enrich.Action),discard:mesRec.Discard,emp,status:conflict?"CONFLICT – MANUAL REVIEW":"MES MASTER",
          confidence:enrich?90:100,source:["MES",...(enrich?[enrich._src]:[])],sources:{mes:mesRec,chi:chiRecs[0]||null,loc:locRecs[0]||null}}));
      });
    } else if(manual.length){
      const primary=manual[0]; const emp=resolveEmployee(primary,primary._src==="Chinese"?"chinese":"local");
      events.push(makeEvent({today,seq:seq++,lts,date:primary.Date,shift:primary.Shift,machine:primary.Machine,cause:primary.Cause,
        action:primary.Action,discard:primary.Discard,emp,status:conflict?"CONFLICT – MANUAL REVIEW":"MANUAL ADDED – MES MISSING",confidence:60,
        source:[...new Set(manual.map(m=>m._src))],sources:{mes:null,chi:chiRecs[0]||null,loc:locRecs[0]||null}}));
    }
  });
  state.events=events;
}

function gapRows(events){ return (events||state.events).filter(e=>!e.source.includes("MES")).map(e=>({
  LTS:e.lts,Date:e.date,RootCause:e.cause||"—",Discard_mm:e.discard,Employee:e.empName||e.empId||"—",
  Source:e.source.join("+"),Issue:"No MES record found for this LTS"})); }

/* ---------- KPI / ANALYSIS (all accept an optional events list; default = full dataset) ---------- */
function kpis(events){ events=events||state.events; const total=events.length;
  const totalDiscard=events.reduce((s,e)=>s+(e.discard||0),0); const st=evalStats(events);
  const den=st.eff>0?st.eff:(st.gradeA+st.totalCos);
  const mesLTS=new Set(events.filter(e=>e.source.includes("MES")).map(e=>e.lts)).size;
  const totalLTS=new Set(events.map(e=>e.lts)).size;
  return {total,totalDiscard,avgDiscard:total?(totalDiscard/total).toFixed(1):0,st,as1:st.as1,cosA:st.cosA,totalCos:st.totalCos,
    cosRate:den?(st.totalCos/den*100).toFixed(2):"0.00",successRate:st.rate==null?"n/a":st.rate.toFixed(1),
    completeness:totalLTS?((mesLTS/totalLTS)*100).toFixed(1):"0.0",mesLTS,totalLTS};
}
function causeRows(events){ events=events||state.events; const c={}; events.forEach(e=>c[e.cause]=(c[e.cause]||0)+1);
  const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]); const total=events.length||1; let cum=0;
  return arr.map(([cause,n])=>{cum+=n; return {RootCause:cause,Events:n,Percent:((n/total)*100).toFixed(1),CumulativePercent:((cum/total)*100).toFixed(1)};});}
function actionRows(events){ events=events||state.events; const g={}; events.forEach(e=>{const a=e.action||"UNKNOWN"; (g[a]=g[a]||[]).push(e);});
  return Object.entries(g).map(([a,list])=>{const s=evalStats(list); return {RecoveryAction:a,Events:list.length,EvaluatedWithMES:s.evaluable,NotSuccess:s.fail,
    SuccessRate_pct:s.rate==null?"n/a":s.rate.toFixed(1),TotalCosmetics:s.totalCos,AvgDiscard_mm:(list.reduce((x,e)=>x+(e.discard||0),0)/list.length).toFixed(1)};});}
function employeeRows(events){ events=events||state.events; const g={}; events.forEach(e=>{const t=e.empType||"Unknown"; (g[t]=g[t]||[]).push(e);});
  const order=["China Support","Local","Unknown"]; const total=events.length||1;
  return order.filter(t=>g[t]).map(t=>{const list=g[t], s=evalStats(list), disc=list.reduce((x,e)=>x+(e.discard||0),0);
    return {EmployeeType:t,RecoveryEvents:list.length,RecoveryShare_pct:(list.length/total*100).toFixed(1),EvaluatedWithMES:s.evaluable,NotSuccess:s.fail,
      SuccessRate_pct:s.rate==null?"n/a":s.rate.toFixed(1),AS1:s.as1,CosmeticA_minus:s.cosA,TotalCosmetics:s.totalCos,TotalDiscard_mm:disc,AvgDiscard_mm:(disc/list.length).toFixed(1)};});}
function qualityRows(events){ events=events||state.events; const k=kpis(events); const gaps=gapRows(events);
  return [{Metric:"Total Distinct LTS",Value:k.totalLTS},{Metric:"LTS Found in MES",Value:k.mesLTS},
    {Metric:"LTS Missing from MES",Value:k.totalLTS-k.mesLTS},{Metric:"MES Completeness (%)",Value:k.completeness},
    {Metric:"Consolidated Events",Value:k.total},{Metric:"Conflict – Manual Review Events",Value:events.filter(e=>e.status.includes("CONFLICT")).length},
    {Metric:"MES Raw Records",Value:state.mes.length},{Metric:"Chinese Manual Records",Value:state.chinese.length},
    {Metric:"Local Manual Records",Value:state.local.length}];}
function eventsToRows(events){ const N="No info in MES"; return (events||state.events).map(e=>{const m=!!e.sources.mes; const f=v=>m?((v==null||v==="")?"":v):N;
  return {EventID:e.id,LTS:e.lts,Date:e.date,Shift:e.shift,Machine:e.machine,DataOrigin:sourceLabel(e),Status:e.status,
    Employee:e.empName||e.empId||"",EmployeeType:e.empType,RootCause:e.cause,RecoveryAction:e.action,

function downloadSnapshot(){

function importSnapshot(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const payload=JSON.parse(e.target.result); if(!payload||!payload.state) throw new Error("Not a recognized data file");
      const merge=confirm("Merge this file's data into what you already have? Click OK to merge (recommended, keeps your existing data and adds new rows), or Cancel to replace everything with this file instead.");
      if(merge){
        ["mes","chinese","local"].forEach(k=>{ const r=mergeRecords(state[k], payload.state[k]||[]); state[k]=r.merged; });
      } else {
        state.mes=payload.state.mes||[]; state.chinese=payload.state.chinese||[]; state.local=payload.state.local||[];

      if(payload.cfg) Object.assign(CFG, payload.cfg);
      state.events=[];

}

  return {key:ds,label:ds.slice(5)}; }

  return Object.values(m).sort((a,b)=>a.key<b.key?-1:1); }
function productTypes(events){ const c={}; events.filter(e=>e.sources.mes&&e.totalCos!=null&&e.productType).forEach(e=>c[e.productType]=(c[e.productType]||0)+1);
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]); }
function cosmeticSeries(events,product){
  const ps=groupPeriods(events.filter(e=>e.sources.mes&&e.totalCos!=null&&(!product||e.productType===product)));
  const out={labels:[],shippable:[],downgrade:[],total:[]};
  ps.forEach(p=>{ const s=evalStats(p.events); const den=s.eff>0?s.eff:(s.gradeA+s.totalCos); const r=n=>den?+(n/den*100).toFixed(2):null;
    out.labels.push(p.label); out.shippable.push(r(s.as1)); out.downgrade.push(r(s.cosA)); out.total.push(r(s.totalCos)); });
  return out; }
function recoverySeries(events){
  const ps=groupPeriods(events); const rate=s=>s.rate==null?null:+s.rate.toFixed(1);
  const o={labels:[],chiN:[],locN:[],totN:[],chiRate:[],locRate:[],share:[]};
  ps.forEach(p=>{ const c=p.events.filter(e=>e.empType==="China Support"), l=p.events.filter(e=>e.empType==="Local");
    o.labels.push(p.label); o.chiN.push(c.length); o.locN.push(l.length); o.totN.push(p.events.length);
    o.chiRate.push(rate(evalStats(c))); o.locRate.push(rate(evalStats(l))); o.share.push(p.events.length?+(l.length/p.events.length*100).toFixed(1):null); });
  return o; }

  return `<svg class="machine" viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg"><ellipse cx="180" cy="200" rx="165" ry="10" fill="rgba(15,33,56,.15)"/><rect x="24" y="44" width="216" height="146" rx="18" fill="#f4f8ff" stroke="#9fb3d6" stroke-width="3"/><rect x="24" y="36" width="216" height="28" rx="12" fill="#2f5fa8"/><text x="132" y="55" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Nunito,sans-serif">DIAMOND WIRE SAW</text><rect x="46" y="76" width="140" height="92" rx="12" fill="#1f3556"/><rect class="ingot" x="82" y="96" width="68" height="56" rx="5" fill="#7d93b5" stroke="#b8c8e2" stroke-width="2"/><g class="wires" stroke="#ffe27a" stroke-width="1.3">${w}</g><circle cx="66" cy="90" r="8" fill="#c9d6ea"/><circle cx="166" cy="90" r="8" fill="#c9d6ea"/><circle cx="66" cy="154" r="8" fill="#c9d6ea"/><circle cx="166" cy="154" r="8" fill="#c9d6ea"/><rect x="198" y="76" width="30" height="92" rx="10" fill="#e3ecff" stroke="#9fb3d6" stroke-width="2"/><circle cx="207" cy="98" r="3.2" fill="#1b2a41"/><circle cx="220" cy="98" r="3.2" fill="#1b2a41"/><path d="M205 108q7 7 16 0" stroke="#1b2a41" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="213" cy="132" r="6" fill="#ff8a8a"/><circle cx="213" cy="152" r="6" fill="#6ee7a8"/><g class="stack"><rect x="262" y="142" width="78" height="14" rx="6" fill="#3d4d69"/><rect x="262" y="128" width="78" height="14" rx="6" fill="#4b5d7c"/><rect x="266" y="114" width="70" height="14" rx="6" fill="#5b6f92"/><rect x="262" y="100" width="78" height="14" rx="6" fill="#4b5d7c"/><rect x="266" y="86" width="70" height="14" rx="6" fill="#5b6f92"/></g><text x="300" y="178" text-anchor="middle" font-size="11" font-weight="800" fill="#5b6b78" font-family="Nunito,sans-serif">WAFERS ✨</text></svg>`; }
function heroFor(page){
  if(page!=="dashboard"&&page!=="upload") return "";
  state.tip=((state.tip||0)+1)%TIPS.length; const has=state.events.length;
  const c=(cls,ic,t,v)=>`<div class="ov ${cls}"><span class="ovi">${ic}</span><div><small>${t}</small><b>${v}</b></div></div>`;
  let right;
  if(page==="dashboard"){ const k=has?kpis(state.events):null;
    right=`<div class="ovwrap"><div class="ovh">✨ Today's Overview</div><div class="ovgrid">${c("g","🔧","Wire Break Cases",has?k.total:"—")}${c("b","💪","Success Rate",has&&k.successRate!=="n/a"?k.successRate+"%":"—")}${c("r","🚨","Action Required",has?k.st.fail:"—")}${c("o","🛰️","MES Complete",has?k.completeness+"%":"—")}</div></div>`; }
  else right=`<div class="ovwrap"><div class="ovh">🍽️ Feed the machine!</div><div class="ovgrid">${c("b","🏭","MES rows",state.mes.length)}${c("o","🇨🇳","China list",state.chinese.length)}${c("g","🏠","Local list",state.local.length)}${c("r","🧾","Events",state.events.length)}</div></div>`;
  return `<div class="hero"><div><div class="chips"><span>Better Recovery</span><span>Less Discard</span><span>Higher Yield</span></div><h2>${page==="upload"?"Paste your lists below 📋":"Hi, Engineer! 👷"}</h2>
    <div class="herol">${mascot(92)}<div class="bubble2">${TIPS[state.tip]}</div></div></div>
    <div style="text-align:center"><span class="mlabel">🟢 Production Line · Wafer Cutting</span>${machineSVG()}</div>${right}</div>`;
}
function decorate(){ const b=document.getElementById("brandic"); if(b) b.innerHTML=mascot(40);
  const f=document.getElementById("sidefoot"); if(f) f.innerHTML=`<div class="bubble">Small Recovery,<br>Big Impact! 💖</div>${mascot(84)}`; }
function render(){
  saveState();
  killCharts(); nav(); decorate();
  const m=document.getElementById("main");
  const map={upload:pageUpload,recon:pageRecon,dashboard:pageDashboard,eventdetail:pageEventDetail,ltssearch:pageLTS,
    rootcause:pageRootCause,recovery:pageRecovery,employee:pageEmployee,dataquality:pageDataQuality,export:pageExport};
  m.innerHTML=heroFor(state.page)+(map[state.page]||pageUpload)();
  if(state.page==="dashboard"&&state.events.length) drawDashboardCharts(filteredEvents());
}

loadState();
render();
</script>
